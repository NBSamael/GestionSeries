# Modèle de configuration de GestionSeries.
#
# Copiez ce fichier en "gestionseries.properties" (à la racine du projet ou dans
# votre dossier personnel) et renseignez vos clés API. Seule la clé de la source
# de données choisie (menu Paramètres > Préférences) est obligatoire.
# Le fichier gestionseries.properties est exclu de Git : ne versionnez jamais
# vos clés API.

# Clé API TVDB v4 (https://thetvdb.com/dashboard/account/apikey)
tvdb.apikey=

# PIN d'abonné : uniquement pour une clé "user-supported", laisser vide sinon
tvdb.pin=

# Clé API TMDB (https://www.themoviedb.org/settings/api)
tmdb.apikey=
